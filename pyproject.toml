[project]
name = "seo-python-hub"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tanvir", email = "tanvirahamed.foysal.00@gmail.com" }
]
requires-python = ">=3.14.6"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "cloudinary>=1.46.2",
    "fastapi-mail>=1.6.8",
    "fastapi[standard]>=0.141.1",
    "greenlet>=3.5.6",
    "passlib[argon2]>=1.7.4",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-jose>=3.5.0",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]

[tool.fastapi]
entrypoint = "app.main:app"


[tool.pytest.ini_options]
pythonpath = ["."]


[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
