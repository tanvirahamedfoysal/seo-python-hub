name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get Flutter dependencies
        working-directory: frontend
        run: flutter pub get
      - name: Build Flutter web app
        working-directory: frontend
        run: flutter build web --release --dart-define=API_BASE_URL=https://seo-python-hub-437e0515.fastapicloud.dev
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SEO_PYTHON_HUB }}
          projectId: seo-python-hub
          entryPoint: frontend
